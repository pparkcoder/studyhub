spring:
  datasource:
    url: jdbc:mysql://localhost:3306/studyhub?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: studyhub
    password: studyhub1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    # org.hibernate.orm.jdbc.bind: trace

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:temporary-local-dev-secret-key-change-this-in-production-min-32bytes}
  access-token-expiration: 1800000
  refresh-token-expiration: 1209600000 # 14일
  # 900000 : 15분
  # 1800000 : 30분
  # 3600000 : 1시간
  # 86400000 : 24시간
  # 604800000 : 7일
